name: Cohort cache substitution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  substitute:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-darwin
            runner: macos-15
          - system: x86_64-linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require private cache read access
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: test -n "$CACHIX_AUTH_TOKEN"

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Configure private cache read access
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: tan
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Verify published cohort in an empty store
        shell: bash
        env:
          COHORT_SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          receipt = json.loads(Path('cabal/cohort-cache', os.environ['COHORT_SYSTEM'] + '.json').read_text())
          assert receipt['context']['cohortFreezeSha256'] == hashlib.sha256(Path('cabal/cohort.freeze').read_bytes()).hexdigest(), 'stale publication receipt'
          PY
          worker_root="$(python3 -c 'import pathlib,tempfile; print(pathlib.Path(tempfile.mkdtemp(prefix="cohort-cache-")).resolve())')"
          python3 scripts/cohort-cache.py verify \
            --receipt "cabal/cohort-cache/$COHORT_SYSTEM.json" \
            --store "local?root=$worker_root" \
            --evidence cohort-cache-substitution.json

      - name: Retain substitution evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cohort-cache-${{ matrix.system }}
          path: cohort-cache-substitution.json
          if-no-files-found: error
